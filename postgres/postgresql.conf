# ===============================================================
# CONFIGURACIÓN DE TELEMETRÍA Y PERFILADO (POSTGRESQL 16)
# ===============================================================

# Conectividad
listen_addresses = '*'
max_connections = 100

# Memoria y recursos para simulaciones de carga
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB

# ===============================================================
# 1. TELEMETRÍA Y LOGGING INTENSIVO
# Permite demostrar que CADA sentencia genera un log y que
# los logs crecen mucho más rápido que la base de datos misma.
# ===============================================================
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql.log'
log_file_mode = 0644
log_truncate_on_rotation = off

# Prefijo detallado con timestamp, PID, usuario y BD
log_line_prefix = '%m [%p] %q%u@%d '

# Registrar TODAS las sentencias SQL ejecutadas
log_statement = 'all'

# Registrar duración de cada consulta
log_duration = on
log_min_duration_statement = 0

# Telemetría de bloqueos y checkpoints
log_checkpoints = on
log_lock_waits = on

# Extensión pg_stat_statements para análisis de consultas pesadas
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
